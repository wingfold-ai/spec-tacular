[package]
name = "spec-tacular"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal UI for spec-driven development built on OpenSpec: every requirement reviewed before it is built"
repository = "https://github.com/mhoegger/spec-tacular"
readme = "README.md"
keywords = ["openspec", "tui", "spec-driven", "ratatui", "agents"]
categories = ["command-line-utilities", "development-tools"]
# The oldest toolchain CI runs the test suite with (.github/workflows/ci.yml).
# ratatui 0.30 needs 1.88; nothing in this crate needs newer.
rust-version = "1.88"

[[bin]]
name = "spectacular"
path = "src/main.rs"

# A scripted ACP agent the tests talk to instead of a real one (and so
# instead of spending money): tests/support/fake_acp_agent.rs. It is a
# binary because the point is the real thing — a child process, JSON-RPC
# over its stdio, a process group to clean up.
[[bin]]
name = "fake-acp-agent"
path = "tests/support/fake_acp_agent.rs"
test = false
doc = false

[dependencies]
# The Agent Client Protocol: JSON-RPC to an agent over its stdio, typed.
# Pure Rust (futures, serde, async-io) — nothing compiles C.
agent-client-protocol = "2.2.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
# The `Stream` trait crossterm's `EventStream` implements, polled without
# pulling in the whole `futures` family.
futures-core = "0.3.31"
# `Sink`/`Stream` adapters over the agent's pipes, for the ACP transport.
futures = "0.3.31"
hex = "0.4.3"
# Signals and setsid: FFI declarations only — libc compiles no C, so the
# no-C-toolchain build in docs/rust-port.md still holds.
libc = "0.2.180"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
# Temp directories for the file-I/O tests. Pure Rust, like everything else.
tempfile = "3.27.0"

# A single static binary people download is the point of the port, so the
# release profile optimises for size as much as for speed.
[profile.release]
lto = true
codegen-units = 1
strip = true
