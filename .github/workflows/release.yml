name: Release

# Push a tag `vX.Y.Z` matching Cargo.toml's version to publish a release:
# static Linux binaries (musl, x86_64 and aarch64), macOS binaries (x86_64 and
# Apple silicon), each as a tar.gz with the README and the licence, and a
# SHA256SUMS file. A tag with a hyphen (`v1.0.0-rc.1`) makes a pre-release.
#
# A pull request that changes this workflow or the linker setup runs the
# build and every check as a dry run, packaged as `dev`; only a tag publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .cargo/config.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # macOS binaries run on 11 (Big Sur) and later.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both Linux targets link with rust-lld and a self-contained musl
          # sysroot (.cargo/config.toml), so aarch64 cross-compiles from an
          # x86_64 runner with nothing but the rustup target.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          # macos-15 is Apple silicon; Xcode's toolchain links x86_64 too.
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      # The explicit --target overrides .cargo/config.toml's default (musl
      # x86_64), which is what makes the macOS builds macOS builds.
      - name: Build
        shell: bash
        run: cargo build --locked --release --target "$TARGET" --bin spectacular

      # The release profile already strips (Cargo.toml `strip = true`); this
      # checks it did, and that every binary starts: aarch64 Linux under qemu,
      # x86_64 macOS under Rosetta on the Apple-silicon runner.
      - name: Check the binary
        shell: bash
        run: |
          bin="target/$TARGET/release/spectacular"
          file "$bin"
          ls -l "$bin"
          case "$TARGET" in
            *-linux-musl)
              file "$bin" | grep -q 'static' || { echo "::error::not static"; exit 1; }
              file "$bin" | grep -q 'stripped' || { echo "::error::not stripped"; exit 1; }
              ;;
            *-apple-darwin)
              # `file` does not say whether a Mach-O is stripped; the symbol
              # table does. Unstripped, it holds tens of thousands of
              # symbols; stripped, only what the dynamic linker needs.
              symbols=$(nm -U "$bin" 2>/dev/null | wc -l | tr -d ' ')
              echo "defined symbols: $symbols"
              [ "$symbols" -lt 1000 ] || { echo "::error::not stripped ($symbols symbols)"; exit 1; }
              ;;
          esac
          case "$TARGET" in
            x86_64-unknown-linux-musl|aarch64-apple-darwin)
              "$bin" --version ;;
            aarch64-unknown-linux-musl)
              sudo apt-get update -qq
              sudo apt-get install -y -qq qemu-user
              qemu-aarch64 "$bin" --version ;;
            x86_64-apple-darwin)
              sudo softwareupdate --install-rosetta --agree-to-license
              arch -x86_64 "$bin" --version ;;
          esac

      - name: Package
        shell: bash
        run: |
          name="spectacular-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/spectacular" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        run: |
          flags=(--title "spec-tacular $TAG" --generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
