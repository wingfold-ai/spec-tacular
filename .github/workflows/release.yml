name: Release

# Push a tag `vX.Y.Z` matching package.json's version to publish a release:
# standalone `spec-tacular` binaries (Bun runtime, program and OpenTUI's native
# library in one file) for Linux and macOS, x64 and arm64, each as a tar.gz
# with the README and the licence, and a SHA256SUMS file; then the same builds
# as npm packages (@spec-tacular/cli and one package per platform). A tag with
# a hyphen (`v1.0.0-rc.1`) makes a pre-release, published to npm under `next`.
#
# Merging a pull request into main that bumps the version does this on its
# own: auto-release.yml tags the merge and starts this workflow for the tag
# (a tag pushed by a workflow never triggers another one by itself). It always
# runs as this workflow, never as a reusable one, because npm's trusted
# publishing is set up for release.yml.
#
# A pull request that changes this workflow or the build scripts runs the
# build and every check as a dry run, packaged as `dev`; only a tag publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/auto-release.yml
      - scripts/**
  # Started by auto-release.yml, or by hand for a tag whose release or npm
  # publish did not finish (Actions → Release → Run workflow). Both steps skip
  # what is already published.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish, already pushed (e.g. v0.6.0)
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform builds on its own kind of runner: `bun install`
          # fetches OpenTUI's native library only for the machine it runs on,
          # and the smoke test then runs the binary natively. x64 builds use
          # Bun's baseline runtime, which runs on CPUs without AVX2.
          - { platform: linux-x64, os: ubuntu-24.04, target: bun-linux-x64-baseline, test: true }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: bun-linux-arm64 }
          - { platform: darwin-arm64, os: macos-15, target: bun-darwin-arm64 }
          - { platform: darwin-x64, os: macos-15-intel, target: bun-darwin-x64-baseline }
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called for a tag: build exactly what was tagged.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # A release is built from a clean cache, never one a pull request could have filled.
          no-cache: true

      - name: Check the tag matches package.json
        if: env.TAG != 'dev'
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        if: matrix.test
        run: |
          bun run typecheck
          bun test

      - name: Build
        run: bun run build --target ${{ matrix.target }}

      # --version checks the binary starts; the TUI smoke test checks it draws
      # a frame, which is what loads the embedded native library.
      - name: Check the binary
        shell: bash
        run: |
          bin=dist/spec-tacular
          file "$bin"
          ls -l "$bin"
          version=$(bun -e 'console.log(require("./package.json").version)')
          out=$("$bin" --version)
          echo "$out"
          [ "$out" = "spec-tacular $version" ] || { echo "::error::unexpected --version output: $out"; exit 1; }
          "$bin" --help > /dev/null
          scripts/smoke-tui.sh "$bin"

      - name: Package
        shell: bash
        run: |
          name="spec-tacular-$TAG-${{ matrix.platform }}"
          mkdir -p "pkg/$name"
          cp dist/spec-tacular dist/THIRD_PARTY_NOTICES.md README.md LICENSE "pkg/$name/"
          tar -C pkg -czf "pkg/$name.tar.gz" "$name"
          cd pkg
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: |
            pkg/*.tar.gz
            pkg/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Signed build provenance for every archive (SLSA, via Sigstore):
      # `gh attestation verify <archive> --repo wingfold-ai/spec-tacular`.
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # GitHub stores attestations for public repositories only on this plan:
      # while the repository is private, releases go out without provenance.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        id: attest
        with:
          subject-path: dist/*.tar.gz

      # The signed provenance also ships with the release, for verifiers that
      # read it from the assets (and for OpenSSF Scorecard's Signed-Releases).
      - name: Provenance bundle
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/spec-tacular-$TAG.intoto.jsonl"

      - name: Create the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          flags=(--title "spec-tacular $TAG" --generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          shopt -s nullglob
          gh release create "$TAG" "${flags[@]}" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/*.intoto.jsonl

  npm:
    name: publish to npm
    needs: release
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # npm's trusted publisher for each package names this workflow and this
    # environment; npm accepts the job's OIDC token instead of a stored token.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+; Node 24 brings both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Lay out the packages
        run: |
          mkdir builds
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C builds; done
          bun scripts/npm-packages.ts --version "${TAG#v}" --builds builds --out npm-out

      # The platform packages first: @spec-tacular/cli names them as optional
      # dependencies at exactly this version. A version already on npm is
      # skipped, so a re-run finishes what a failed one left.
      - name: Publish
        run: |
          npm --version
          case "$TAG" in *-*) tag=next ;; *) tag=latest ;; esac
          for dir in npm-out/cli-* npm-out/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm already."
              continue
            fi
            npm publish "$dir" --tag "$tag"
          done
