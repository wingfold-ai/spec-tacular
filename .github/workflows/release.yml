name: Release

# Push a tag `vX.Y.Z` matching package.json's version to publish a release:
# standalone `spec-tacular` binaries (Bun runtime, program and OpenTUI's native
# library in one file) for Linux and macOS, x64 and arm64, each as a tar.gz
# with the README and the licence, and a SHA256SUMS file. A tag with a hyphen
# (`v1.0.0-rc.1`) makes a pre-release.
#
# Merging a pull request into ts/main that bumps the version does this on its
# own: auto-release.yml tags the merge and calls this workflow for the tag
# (a tag pushed by a workflow never triggers another one by itself).
#
# A pull request that changes this workflow or the build scripts runs the
# build and every check as a dry run, packaged as `dev`; only a tag publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/auto-release.yml
      - scripts/**
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish, already pushed
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform builds on its own kind of runner: `bun install`
          # fetches OpenTUI's native library only for the machine it runs on,
          # and the smoke test then runs the binary natively. x64 builds use
          # Bun's baseline runtime, which runs on CPUs without AVX2.
          - { platform: linux-x64, os: ubuntu-24.04, target: bun-linux-x64-baseline, test: true }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: bun-linux-arm64 }
          - { platform: darwin-arm64, os: macos-15, target: bun-darwin-arm64 }
          - { platform: darwin-x64, os: macos-15-intel, target: bun-darwin-x64-baseline }
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called for a tag: build exactly what was tagged.
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check the tag matches package.json
        if: env.TAG != 'dev'
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        if: matrix.test
        run: |
          bun run typecheck
          bun test

      - name: Build
        run: bun run build --target ${{ matrix.target }}

      # --version checks the binary starts; the TUI smoke test checks it draws
      # a frame, which is what loads the embedded native library.
      - name: Check the binary
        shell: bash
        run: |
          bin=dist/spec-tacular
          file "$bin"
          ls -l "$bin"
          version=$(bun -e 'console.log(require("./package.json").version)')
          out=$("$bin" --version)
          echo "$out"
          [ "$out" = "spec-tacular $version" ] || { echo "::error::unexpected --version output: $out"; exit 1; }
          "$bin" --help > /dev/null
          scripts/smoke-tui.sh "$bin"

      - name: Package
        shell: bash
        run: |
          name="spec-tacular-$TAG-${{ matrix.platform }}"
          mkdir -p "pkg/$name"
          cp dist/spec-tacular README.md LICENSE "pkg/$name/"
          tar -C pkg -czf "pkg/$name.tar.gz" "$name"
          cd pkg
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: |
            pkg/*.tar.gz
            pkg/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        run: |
          flags=(--title "spec-tacular $TAG" --generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
