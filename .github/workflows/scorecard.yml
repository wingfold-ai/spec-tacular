# OpenSSF Scorecard: rates the repository's security practices (pinned
# actions, branch protection, token permissions, …), publishes the result for
# the README badge and lists findings under Security → Code scanning.
# Scorecard publishes for public repositories only, so while the repository is
# private the job is skipped.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  # re-rates when the branch ruleset changes
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # upload the results to code scanning, and publish them for the badge
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
