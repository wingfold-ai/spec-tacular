name: Auto-release

# Every merge into ts/main whose package.json version has no release yet is
# released: the merge commit is tagged `v<version>` and the release workflow
# builds and publishes it. A merge that does not bump the version releases
# nothing, so a pull request decides whether it ships by bumping it.
#
# The tag is pushed with this workflow's own token, which never triggers
# another workflow — so the release is called from here rather than left to
# release.yml's tag trigger, and runs exactly once.
on:
  push:
    branches: [ts/main]

permissions:
  contents: read

# Two merges in quick succession must not both tag the same version.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag the new version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this version released yet?
        id: version
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists: nothing to release. Bump the version in package.json to release."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag the merge
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged $GITHUB_SHA as $TAG" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: tag
    if: needs.tag.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
