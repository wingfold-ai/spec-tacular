name: Auto-release

# Every merge into main whose package.json version has no release yet is
# released: the merge commit is tagged `v<version>` and the release workflow
# builds and publishes it. A merge that does not bump the version releases
# nothing, so a pull request decides whether it ships by bumping it.
#
# The tag is pushed with this workflow's own token, which never triggers
# another workflow — so the release is started from here (workflow_dispatch)
# rather than left to release.yml's tag trigger, and runs exactly once.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges in quick succession must not both tag the same version.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag the new version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists: nothing to release. Bump the version in package.json to release."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag the merge
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        # Through the API, so the checkout keeps no credentials.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
          echo "Tagged $GITHUB_SHA as $TAG" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: start the release
    needs: tag
    if: needs.tag.outputs.tag
    runs-on: ubuntu-24.04
    permissions:
      # workflow_dispatch is the one event the job's token may start another
      # workflow with. Started, not called: npm's trusted publishing checks
      # the top-level workflow, and that has to be release.yml.
      actions: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
          echo "Started the release of $TAG: Actions → Release" >> "$GITHUB_STEP_SUMMARY"
