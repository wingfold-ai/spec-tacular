# No C toolchain on the dev machine (no `cc`/`gcc`, no sudo), so the default
# `x86_64-unknown-linux-gnu` target cannot link. Building against musl with
# Rust's bundled `rust-lld` and a self-contained sysroot removes the need for
# a system linker entirely, and gives a fully static binary as a bonus.
#
# CI and the release workflow use this as it is: on a runner with a C
# toolchain, only build scripts and proc-macros (compiled for the host) go
# through `cc`; the crate itself still links with `rust-lld`.
#
# If you do have a working C toolchain, `cargo build --target
# x86_64-unknown-linux-gnu` still works; nothing here is load-bearing for the
# source. On macOS, pass `--target aarch64-apple-darwin` (or `x86_64-…`).
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]

# The same for 64-bit ARM, so the release workflow cross-compiles it from an
# x86_64 runner with nothing but `rustup target add aarch64-unknown-linux-musl`.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
