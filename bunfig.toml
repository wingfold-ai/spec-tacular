# The Solid JSX transform. Without it OpenTUI components render once and never
# update — Solid's reactivity is a compile-time transform, not a runtime one.
preload = ["@opentui/solid/preload"]

[test]
preload = ["@opentui/solid/preload"]
# Bun's own coverageThreshold applies to every file; the floor CI enforces is
# on the totals instead (.github/workflows/ci.yml, "Coverage floor").
coverageSkipTestFiles = true
