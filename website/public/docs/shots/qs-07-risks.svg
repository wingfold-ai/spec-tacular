<text x="8.4" y="13.6" textLength="100.8" class="c0 b">spec-tacular</text>
<text x="126" y="13.6" textLength="277.2" class="c1">~/my-app › add-user-login › specs</text>
<text x="25.2" y="31.6" textLength="193.2" class="c0">add-user-login › review</text>
<text x="25.2" y="67.6" textLength="159.6" class="c1">risks   risk 5 of 6</text>
<text x="25.2" y="103.6" textLength="252" class="c0">Risk: Password stored readable</text>
<text x="25.2" y="139.6" textLength="596.4" class="c3">- **Hazard:** a password can be read back from the database or the logs</text>
<text x="25.2" y="157.6" textLength="277.2" class="c3">- **Affects:** Sign in with email</text>
<text x="25.2" y="175.6" textLength="394.8" class="c3">- **Boundary:** storing and checking a password</text>
<text x="25.2" y="193.6" textLength="537.6" class="c3">- **Causes:** storing it in plain text; logging the request body</text>
<text x="25.2" y="211.6" textLength="168" class="c3">- **Severity:** high</text>
<text x="25.2" y="229.6" textLength="630" class="c3">- **Guard:** only a salted hash of the password is ever stored, and request</text>
<text x="25.2" y="247.6" textLength="193.2" class="c3">bodies are never logged</text>
<text x="25.2" y="265.6" textLength="613.2" class="c3">- **Check:** a test signs up, then searches the database file and the log</text>
<text x="25.2" y="283.6" textLength="285.6" class="c3">for the password and finds neither</text>
<text x="277.2" y="373.6" textLength="184.8" class="c1">4 accepted · 2 pending</text>
<text x="25.2" y="391.6" textLength="856.8" class="c1">a accept · r revise with AI · x reject · d defer · ctrl+e editor · s skip · n/p move · pgdn scroll · ?</text>
<text x="25.2" y="409.6" textLength="109.2" class="c1">help · q back</text>
