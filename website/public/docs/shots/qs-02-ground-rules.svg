<text x="25.2" y="103.6" textLength="445.2" class="c0">Domain · What the project is about, in its own words.</text>
<text x="16.8" y="121.6" textLength="336" class="c0 b">What the system is for, and who uses it.</text>
<text x="16.8" y="139.6" textLength="739.2" class="c1">Two sentences. e.g. "Lets clinic staff book rooms. Used by receptionists, not patients."</text>
