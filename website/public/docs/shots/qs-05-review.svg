<text x="8.4" y="13.6" textLength="100.8" class="c0 b">spec-tacular</text>
<text x="126" y="13.6" textLength="277.2" class="c1">~/my-app › add-user-login › specs</text>
<text x="25.2" y="31.6" textLength="193.2" class="c0">add-user-login › review</text>
<text x="25.2" y="67.6" textLength="294" class="c1">auth   requirement 2 of 4   [ADDED]</text>
<text x="25.2" y="103.6" textLength="344.4" class="c0">Requirement: Lock after repeated failures</text>
<text x="25.2" y="139.6" textLength="579.6" class="c3">The system SHALL lock an account quickly after several failed sign-in</text>
<text x="25.2" y="157.6" textLength="302.4" class="c3">attempts, through `POST /api/login`.</text>
<text x="42" y="193.6" textLength="226.8" class="c4">Scenario: Too many attempts</text>
<text x="58.8" y="211.6" textLength="453.6" class="c3">- **WHEN** a user fails to sign in five times in a row</text>
<text x="58.8" y="229.6" textLength="453.6" class="c3">- **THEN** further attempts are refused for 15 minutes</text>
<text x="42" y="265.6" textLength="630" class="c5">! undefined words: quickly, several — how much, how soon, compared to what?</text>
<text x="42" y="301.6" textLength="352.8" class="c5">1. names an HTTP endpoint: POST /api/login</text>
<text x="277.2" y="409.6" textLength="184.8" class="c1">1 accepted · 3 pending</text>
