<text x="8.4" y="13.6" textLength="100.8" class="c0 b">spec-tacular</text>
<text x="126" y="13.6" textLength="302.4" class="c1">~/my-app › add-user-login › proposal</text>
<text x="25.2" y="31.6" textLength="361.2" class="c0">add-user-login › proposal · 100% · 25 lines</text>
<text x="16.8" y="49.6" textLength="554.4" class="c3">• A wrong password is refused without saying which part was wrong.</text>
<text x="16.8" y="67.6" textLength="470.4" class="c3">• Repeated failed attempts lock the account for a while.</text>
<text x="16.8" y="85.6" textLength="420" class="c3">• Users can sign out on the device they are using.</text>
<text x="16.8" y="121.6" textLength="100.8" class="c0 b">Capabilities</text>
<text x="16.8" y="157.6" textLength="134.4" class="c4 b">New Capabilities</text>
<text x="16.8" y="175.6" textLength="546" class="c3">• `auth`: signing in and out with an email address and a password</text>
<text x="16.8" y="211.6" textLength="50.4" class="c0 b">Impact</text>
<text x="16.8" y="229.6" textLength="630" class="c3">A new login form and session cookie. Every notes route now needs a session.</text>
<text x="16.8" y="265.6" textLength="67.2" class="c0 b">Boundary</text>
<text x="16.8" y="283.6" textLength="109.2" class="c3">• `src/auth/`</text>
<text x="16.8" y="301.6" textLength="193.2" class="c3">• `src/routes/login.ts`</text>
<text x="16.8" y="319.6" textLength="117.6" class="c3">• `test/auth/`</text>
<text x="42" y="481.6" textLength="117.6" class="c5">✓ Accept it  a</text>
<text x="218.4" y="481.6" textLength="554.4" class="c3">✎ Edit it  ctrl+e       ↻ Redraft with feedback  r       ← Back  q</text>
<text x="16.8" y="535.6" textLength="16.8" class="c5">↑↓</text>
