<text x="8.4" y="13.6" textLength="100.8" class="c0 b">spec-tacular</text>
<text x="126" y="13.6" textLength="142.8" class="c1">~/my-app › vision</text>
<text x="8.4" y="31.6" textLength="67.2" class="c2">✓ Set up</text>
<text x="126" y="31.6" textLength="75.6" class="c0">2. Vision</text>
<text x="252" y="31.6" textLength="302.4" class="c1">3. Ground rules      4. First change</text>
<text x="25.2" y="49.6" textLength="92.4" class="c0">Your vision</text>
<text x="16.8" y="85.6" textLength="184.8" class="c0 b">What are you building?</text>
<text x="16.8" y="121.6" textLength="655.2" class="c4">This is a new project, so there is nothing to change yet — start from what you</text>
<text x="16.8" y="139.6" textLength="680.4" class="c4">want it to be. Describe it freely: who it is for, what they will do with it, what</text>
<text x="16.8" y="157.6" textLength="546" class="c4">matters most. Rough is fine; paste a longer text if you have one.</text>
<text x="16.8" y="193.6" textLength="772.8" class="c4">(AI is off: turned off by SPECTACULAR_NO_ADVISOR — your description is saved as the vision.)</text>
<text x="33.6" y="265.6" textLength="730.8" class="c4">› A notes app for people who want their notes private: sign in, write, find them again.</text>
<text x="42" y="337.6" textLength="84" class="c0">▶ Continue</text>
<text x="184.8" y="337.6" textLength="327.6" class="c4">Not a new project — just start a change</text>
<text x="16.8" y="391.6" textLength="42" class="c5">enter</text>
<text x="75.6" y="391.6" textLength="67.2" class="c1">continue</text>
<text x="168" y="391.6" textLength="50.4" class="c5">ctrl+n</text>
<text x="235.2" y="391.6" textLength="142.8" class="c1">not a new project</text>
<text x="403.2" y="391.6" textLength="50.4" class="c5">ctrl+c</text>
<text x="470.4" y="391.6" textLength="33.6" class="c1">back</text>
</svg>
