name: spec-tacular
version: 1
description: >-
  Strictly sequenced spec-driven workflow: proposal → specs → risks → design →
  tasks. Design is written only after specs and their risks are settled; every
  risk is answered in the design and guarded by a test shown to fail without
  its mitigation; cross-cutting decisions are promoted to global ADRs;
  deployment-dependent verification is deferrable.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Why this change exists and which capabilities it touches
    template: proposal.md
    instruction: |
      Establish WHY this change is needed. Keep it to 1-2 pages.

      Sections: Why · What Changes · Capabilities (new and modified) · Impact ·
      Boundary.

      Boundary: the areas of the code this change expects to touch, one path
      or pattern per bullet, in backticks — `src/export/`, `src/**/*.sql`,
      `test/export.test.ts`. Files changed outside it while implementing are
      listed on the change for a human to accept or question, so name what
      the change genuinely needs and no more. Paths, not implementation: a
      folder is enough where the file is not known yet. The boundary also
      sets the change's consequence class, where the project has them: it is
      in the highest class it touches, so a boundary drawn wider than needed
      costs rigor, and one drawn too narrow is caught when the code is.

      Read the project's ground rules in `spec-tacular/foundation/` and the
      accepted ADRs in `spec-tacular/decisions/` before writing. A proposal that
      contradicts an accepted ADR must say so explicitly and argue for
      superseding it — never contradict one silently.

      The Capabilities section is the contract with the specs phase. Research
      existing specs first (`openspec list --specs`, then `openspec show
      "<spec-id>" --type spec`) and reuse exact existing capability paths rather
      than introducing near-duplicates.

      Prefer few capabilities over many. A proposal that names eight new
      capabilities is usually several changes wearing one coat; say so and
      suggest the split instead of proceeding.

      No implementation detail. That is design's job, two phases from now.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: WHAT the system must do, as reviewable requirements
    template: spec.md
    instruction: |
      Write behaviour contracts, one file per capability named in the proposal,
      at `specs/<capability-path>/spec.md`.

      Delta headers: `## ADDED Requirements`, `## MODIFIED Requirements`
      (full updated content), `## REMOVED Requirements` (with **Reason** and
      **Migration**), `## RENAMED Requirements` (FROM:/TO:).

      Format, exactly:
      - `### Requirement: <name>` then normative text using SHALL/MUST.
      - `#### Scenario: <name>` — exactly four hashtags — with WHEN/THEN bullets.
      - Every requirement has at least one scenario, and at least one of them
        says what must NOT happen or how it fails safely — an invalid input
        refused, an action not taken, an error reported. A requirement with
        only happy paths gives the tests nothing to check it against.
      - A requirement verified other than by a test says so on its own line:
        `**Verified by:** analysis`, `inspection` or `demonstration` — a
        quality attribute, an interface agreement, a property checked by a
        tool or by reading. Without the line it is verified by test.
      - New capabilities only: open the file with `## Purpose` (50+ characters).

      STAY ABSTRACT. This is the most common failure in practice, so it is a
      hard rule, not advice.

      A requirement states observable behaviour: inputs, outputs, error
      conditions, external constraints. It does not decide anything the project
      has not decided yet.

      Any concrete value that is NOT a decided contract MUST be marked as an
      example:

          {{example: POST /v1/export}}

      Unmarked concrete values are read as binding contracts and will be
      reviewed as such. Endpoint paths, status codes, field names, table names,
      class names, file paths and library names are all concrete values.

      Write this:
        The system SHALL let an authenticated user export their data in a
        portable, machine-readable format. {{example: CSV}}

      Not this:
        The system SHALL expose GET /api/v2/export returning a CSV via
        ExportController.

      Quick test: if the implementation could change without changing what a
      user or a downstream system observes, it does not belong here.

      Requirements are reviewed and accepted one at a time by a human before
      design begins. Keep each one independently reviewable: one requirement,
      one behaviour.

      FORMAL FORMS. Where a requirement turns on a decision or on timing, add
      its formal form after the normative text, before the scenarios — this
      is what its tests are derived from:

          ```formal
          decision: archive_allowed = tasks_applied AND specs_accepted AND NOT stop_open
          fret: upon request_sent Client shall within 3 ticks satisfy response | timeout_error
          asked: Does a deferred task count as open? — No; deferred tasks are excused.
          ```

      - `decision: <output> = <condition>` — an output defined by a boolean
        condition over inputs: `AND`/`&`, `OR`/`|`, `NOT`/`!`, `XOR`, `->`,
        `<->`, comparisons `= != < > <= >=` against numbers or enum values.
      - `fret: [scope] [condition] <Component> shall [timing] satisfy <response>`
        — NASA FRET's structured English. Scope `in M` / `not in M` /
        `before M` / `after M`; condition `upon C` (when it becomes true) or
        `whenever C` (at every step); timing `immediately`, `initially`,
        `at the next timepoint`, `finally`, `eventually`, `always` (default),
        `never`, `within N ticks`, `for N ticks`, `after N ticks`, `until C`,
        `before C`.
      - `asked: <question> — <answer>`: every question formalizing forced you
        to answer ("promptly" — within how long? "closed" — does deferred
        count?). Put each answer into the prose as well: the prose is what
        the specs promise; the formula must say the same, never more.

      Every variable comes from `spec-tacular/glossary.yaml`, with its role
      (mode, input, output, internal), type and meaning; add the ones you
      need there, with where their value comes from. A decision over more
      than six conditions is several behaviours: split it. `x` and `NOT x`
      are one condition. The glossary's format, exactly:

          variables:
            timer_running:
              role: input              # mode | input | output | internal
              type: bool               # bool | int | float | enum
              meaning: a timer is running when the command starts
              source: the data file's running entry
            file_version:
              role: input
              type: int
              range: [1, 3]            # int and float: the values that occur
              meaning: the data file's schema version
            command:
              role: input
              type: enum
              values: [start, stop, status]
              meaning: the command the user ran
          constraints:
            # Combinations that cannot happen: a truth table marks the rows
            # they rule out impossible instead of demanding tests for them.
            - same_project -> timer_running
            - NOT (command = stop AND command = start)

      Write a constraint for every combination of a formal form's inputs
      that cannot occur — "the same project as the running one" needs a
      running one. Without it, the matrix demands a test for that row.
      A constraint names only glossary variables, in the same expression
      language as `decision:`.

      Formalize where it pays — about half of a system's functional
      requirements, most of the safety-relevant ones. Quality attributes and
      interface agreements stay as prose, verified by inspection or analysis.
      A requirement without a formal form must not lean on words it does not
      define: "promptly", "large", "gracefully" are flagged at review.
    requires:
      - proposal

  - id: risks
    generates: risks.md
    description: What this change could break, and how a test shows it did not
    template: risks.md
    instruction: |
      List the ways this change could go wrong, now that the specs say what it
      must do. A risk is how the change could violate one of its accepted
      requirements, or behaviour the project already has — read the existing
      specs (`openspec list --specs`) for what is already promised.

      Start from the project's hazard register, `spec-tacular/hazards/`: what
      went, or could go, wrong before. For every hazard on a capability this
      change touches, decide whether the change could bring it back or weaken
      its controls. If it could, write it as a risk here and name the entry
      with `- **Known hazard:** HAZ-NNNN`; at archive the risk then updates
      that entry instead of adding a second one.

      Scale them to the change. Every risk costs a review, a design answer
      and a guard test that is shown red, so write the ones a test of the
      requirements would not already catch — never a requirement's own
      scenario restated as a risk. A small change, or one in a low
      consequence class (P2, P3) or with no class, has a handful: at most
      about six, the most severe first.

      Each risk is reviewed by a human, one at a time, and is then followed
      through: the design must answer it, and the tasks must guard it with a
      test that is shown to fail when the mitigation is removed. So write
      risks that a test can catch, not worries.

      Format, exactly:

          ### Risk: <name>
          - **Hazard:** what must not happen, as an observable outcome
          - **Affects:** the requirements and existing capabilities it threatens
          - **Boundary:** the situation it arises in — an edge of the input, a
            second request while the first is pending, an edit made outside
            the tool
          - **Causes:** what could bring it about (optional, when not obvious)
          - **Severity:** high | medium | low
          - **Guard:** the property that rules it out ("a requirement edited
            after acceptance is never counted as accepted")
          - **Check:** how a test shows the guard holds

      A guard can have a formal form too, below the fields, in the same
      ```formal block a requirement uses — usually a `never`:
      `fret: whenever text_changed Review shall never satisfy accepted`.

      A risk the change knowingly leaves unmitigated has an
      `- **Unmitigated:** <why>` line instead of a guard and a check. Use it
      for risks that are real but out of this change's reach, never to avoid
      writing a test. If the project has consequence classes
      (`spec-tacular/classes.yaml`) and this change touches code in a class
      that rules it out, a high-severity risk cannot be left unmitigated: the
      design is refused until it has a guard.

      Find them by walking each accepted requirement through these questions —
      the failure modes safety engineering asks of software:
      - Its output could be wrong, missing, produced when it should not be,
        too early, too late, out of order, or stuck at an old value.
      - An action could be taken when not needed, not taken when needed, or
        last too long or stop too soon.
      - At the boundaries: empty and maximal inputs, the first and the last
        item, exactly at a limit and one past it, repeats, concurrency,
        failure half way.
      - What it leaves behind for existing data, existing callers and
        existing specs.
      - Where it handles identity, permissions or input from outside: a
        caller pretending to be someone else, tampered data, data shown to
        the wrong party, a request that exhausts a resource, gaining rights
        it should not have.

      One risk, one hazard. Name each risk so the design and the tasks can
      refer to it by name.

      Every change has at least one risk. If you truly find none, say what you
      looked at and why nothing there can break, as a single low-severity
      risk with an Unmitigated line.
    requires:
      - specs

  - id: design
    generates: design.md
    description: HOW to implement it, written against settled specs
    template: design.md
    instruction: |
      Explain HOW to build what the specs require.

      This phase starts only after the specs above have been reviewed and
      accepted. Treat them as fixed input. If writing the design reveals that a
      spec is wrong, incomplete or ambiguous, STOP and say so — do not design
      around it and do not edit the spec yourself. The specs go back for
      revision and the design is rewritten against the corrected version. That
      is the whole reason this phase is sequenced after specs.

      Sections: Context · Goals / Non-Goals · Decisions · Risks / Trade-offs ·
      Migration Plan · Open Questions.

      Risks. `risks.md` lists the risks a human accepted for this change. In
      Risks / Trade-offs, answer every one that has no `Unmitigated:` line BY ITS
      EXACT NAME: the decision that mitigates it, and what a guard test will
      check. A risk the design cannot mitigate is a reason to stop, the same
      as a contradicting requirement — do not leave it unanswered.

      Ground rules. Read `spec-tacular/foundation/` and every accepted ADR in
      `spec-tacular/decisions/` first. The design MUST conform to them. Where it
      cannot, propose superseding the specific ADR by number, with rationale —
      never diverge silently.

      Mark every decision with its scope:

          **Scope: local**  — applies to this change only
          **Scope: global** — an architectural rule the whole project should follow

      Global-scope decisions are candidates for promotion to project ADRs during
      review. Err toward `global` for anything about layering, error handling,
      persistence, authentication, API style, or dependency choice: a decision
      wrongly marked local gets silently re-decided, differently, in the next
      change.

      Each decision carries the alternatives considered and why they lost.

      A requirement with a `decision:` formal form is implemented as a pure
      decision function: its inputs in, a plan out — data, not side effects —
      with the side effects done by separate code that does not branch
      (Decide → Plan → Execute). That is what lets its tests run every row of
      its truth table without mocks. Where a decision cannot be made pure,
      say why.

      Architecture and approach, not line-by-line implementation.
    requires:
      - specs
      - risks

  - id: tasks
    generates: tasks.md
    description: Implementation checklist, with deployment-dependent work marked
    template: tasks.md
    instruction: |
      Break the work down. Resolve any design Open Question that would change
      what gets built before writing a single task.

      Format is parsed, so follow it exactly:
      - Group under `## <n>. <Group name>` headings.
      - Every task is `- [ ] <n>.<m> <description>`. Only `x` in the box counts
        as done; `~`, `-` and empty do not.
      - Order by dependency.
      - Each task states how to verify it: a test, a command, an observable
        behaviour, or a delivered artifact.

      Guard tasks. Every risk in `risks.md` without an `Unmitigated:` line gets a
      task that writes its guard test, marked with the risk's exact name:

          - [ ] 3.1 (guard: Edited requirement stays accepted) Test that editing
                an accepted requirement sends it back to pending

      Write it so it can be shown red: the test must fail when the mitigation
      is removed. A guard test that passes either way guards nothing.

      Tests name what they verify. Each task that writes a test says which
      tag its name carries, so the result is traced back to what was
      accepted: `[req:<capability>#<requirement-slug>]` for a requirement,
      `[risk:<change>#<risk-slug>]` for a risk's guard. The slug is the name
      lower-cased, with every run of other characters turned into one dash.
      Every requirement verified by test, and every guarded risk, gets one.

      A requirement or guard with a formal form is not tested by hand-picked
      cases: its test matrix is generated (`spec-tacular matrix <change>
      --write`) — every row of its truth table or every step sequence, with
      the outcome the formula requires — and run as one test per row. Its
      tasks are: write the harness for its component, once per component
      (the file `spec-tacular matrix --write` names, which sets each input in
      the real code and reads each output from it — a mapping where it can
      be), written before the code it tests; the matrix tests pass; and
      `spec-tacular harness <change> --check` catches the changes it makes to
      the code (allowing survivors, with a reason, is the developer's call).
      Each binding of the harness is then reviewed by the developer like a
      requirement — that review is their step, not a task: no task waits
      for it.

      Evidence. If `spec-tacular/verification.yaml` has no uncommented
      `command:` yet, the first task fills it in for the project's test
      runner — uncomment its lines in the file, or write the two lines the
      file shows for another runner — so the tests' results count as
      evidence.

      Deployment-dependent work. Any task that cannot be verified without a
      running deployed environment MUST be marked:

          - [ ] 4.2 (defer: awaiting-deployment) Verify export completes against
                a deployed instance

      These tasks do not block archiving. At archive time their requirements
      move to `spec-tacular/pending-validation.md` instead of merging into the
      accepted specs, so the change can close while what was never verified
      stays visible and unmerged.

      Use this only for work that genuinely needs a deployment. A task that is
      merely hard, or that you would rather not do now, is not deferrable.

      Reference the specs for what, the design for how.
    requires:
      - specs
      - risks
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Work through pending tasks, marking each complete as you go.

    Stay inside the project. Write and change files with your edit tools,
    not with shell redirection or heredocs: edits are pre-approved, a shell
    command that writes files asks the developer every time. Use the
    toolchain that is installed — if it differs from what the design pins,
    say so and carry on with the installed one rather than installing
    another. Scratch work goes in a directory inside the project, ignored by
    git, not in the home directory or system paths.

    Skip tasks marked `(defer: ...)` — they are handled at archive time and are
    not blockers.

    A guard task — `(guard: <risk>)` — is done only once its test has been
    shown to fail without the mitigation. Write the test, run it with the
    mitigation removed or stubbed out and see it fail, restore the mitigation
    and see it pass. Then tick the task and record how, on the task itself:

        - [x] 3.1 (guard: Edited requirement stays accepted) Test that ...
              (shown red: reverted the hash check in review.ts — 1 failure)

    A guard ticked without `(shown red: …)` still counts as open. If the test
    cannot be made to fail, it does not test the risk: say so and stop.

    Anything else worth knowing about a task — a deviation from the plan, a
    follow-up — goes on the task as `(note: …)`. Notes and ticks are
    implementing, not changing the plan: the accepted tasks stay accepted.
    Any other edit to tasks.md sends it back to be read again.

    Put the tag the task names into the test's name, or its suite's —
    `test('[req:export#export-data] exports only the caller\'s rows', …)`.
    A test without its tag is not counted as evidence for anything.

    For a formal requirement, run `spec-tacular matrix <change> --write`: it
    writes the matrix, the table-driven test and the runner. Write only the
    harness it names. A harness drives and observes the real code — it never
    computes the expected answer itself, and it never reads the matrix. Do
    not edit the generated test or skip rows: every row the class requires
    must run.

    Write the harness BEFORE the code it tests, from the glossary — names,
    meanings, roles, types — and without opening the matrix: knowing the
    expected values is how a harness ends up answering for the system.
    Prefer a mapping, `<component>.mapping.yaml` next to where the harness
    would go, over code:

        module: src/archive/decide.ts       # the production module
        create: Client                      # optional: an export constructed per row
        tick: tick                          # optional: the method that advances a step
        inputs:
          tasks_applied: { arg: tasksApplied }   # or set: field, call: method,
                                                 # on_rise / on_fall: method
          request_sent: { on_rise: send, probe: lastRequest }
        outputs:
          archive_allowed: { call: archiveAllowed }   # or read: field, field: x

    A mapping holds no logic, so it cannot compute an answer. Give an input
    a `probe` — a field that reads it back — wherever the system has one:
    then driving one input that moves another fails the row. Write harness
    code only where a mapping cannot express it, and say why.

    Then run `spec-tacular harness <change> --check`: the matrix tests with
    coverage — they must execute the code the harness names — and with
    mutants of that code, each of which a row must catch. A surviving mutant
    means the matrix does not reach that code, or the requirements allow what
    the mutant does: report which, never weaken the code to kill it.

    Stay inside the proposal's Boundary. If the work needs files outside it,
    say which and why in your final message rather than quietly widening it.

    Stay within the accepted specs and the accepted design. If implementation
    reveals that either is wrong, stop and report it rather than improvising:
    the specs were reviewed and accepted by a human, and quietly diverging from
    them makes that review worthless.

    Pause on any blocker or ambiguity.
